<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #555; }
    input, select, button { width: 100%; padding: 10px; margin-top: 4px; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 20px; background: #1F4E78; color: #fff; border: none; border-radius: 6px; }
    button:disabled { background: #999; }
    #errorMsg { color: #D32F2F; font-size: 13px; margin-top: 8px; white-space: pre-line; }
  </style>
</head>
<body>
  <h3>請假申請</h3>

  <label for="leaveDate">日期</label>
  <input type="date" id="leaveDate">

  <label for="leaveType">假別</label>
  <select id="leaveType">
    <option value="病假">病假</option>
    <option value="事假">事假</option>
    <option value="特休">特休</option>
    <option value="加班補休">加班補休</option>
  </select>

  <label for="startTime">開始時間</label>
  <select id="startTime"></select>

  <label for="endTime">結束時間</label>
  <select id="endTime"></select>

  <button id="submitBtn" disabled>驗證中,請稍候...</button>
  <p id="errorMsg"></p>

  <script>
    const LIFF_ID = "2011158711-asycIWGC";
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzy3xDQJCHVBRklyCtHT5I2NBPmYEi87vXMbsYJJRdE_lb64YZe0Nsiz7x5hOsrxD3vhQ/exec";
    let liffReady = false;

    document.getElementById('leaveDate').valueAsDate = new Date();
    generateTimeOptions('startTime');
    generateTimeOptions('endTime');

    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      liffReady = true;
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = "送出";
    }).catch((err) => {
      document.getElementById('errorMsg').textContent = "LIFF 初始化失敗,請確認是否從 LINE 開啟此頁面\n錯誤訊息：" + err;
    });

    function generateTimeOptions(selectId) {
      const select = document.getElementById(selectId);
      for (let h = 0; h < 24; h++) {
        for (const m of [0, 30]) {
          const time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          const opt = document.createElement('option');
          opt.value = time;
          opt.text = time;
          select.appendChild(opt);
        }
      }
    }

    function validateTimeRange(startStr, endStr) {
      const toMinutes = (t) => {
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      };
      const start = toMinutes(startStr);
      const end = toMinutes(endStr);
      if (end <= start) {
        return { valid: false, message: `結束時間（${endStr}）必須晚於開始時間（${startStr}）\n正確範例：開始 15:00,結束 17:00` };
      }
      if (start < toMinutes("08:00") || end > toMinutes("17:00")) {
        return { valid: false, message: `請假時間需在正常班時段內（08:00~17:00）\n您輸入的時間：${startStr}~${endStr}` };
      }
      return { valid: true };
    }

    async function submitLeaveRequest() {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = "";

      if (!liffReady) {
        errorEl.textContent = "LINE 驗證尚未完成,請稍候再試";
        return;
      }

      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const check = validateTimeRange(start, end);
      if (!check.valid) {
        errorEl.textContent = check.message;
        return;
      }

      const idToken = liff.getIDToken();
      if (!idToken) {
        errorEl.textContent = "尚未完成 LINE 登入驗證,請關閉頁面重新從 LINE 開啟一次";
        return;
      }

      const payload = {
        request: 'leave',
        idToken: idToken,
        leaveType: document.getElementById('leaveType').value,
        date: document.getElementById('leaveDate').value,
        startTime: start,
        endTime: end
      };

      alert("送出內容：\n" + JSON.stringify({
        request: payload.request,
        leaveType: payload.leaveType,
        date: payload.date,
        startTime: payload.startTime,
        endTime: payload.endTime,
        idTokenLength: idToken ? idToken.length : 0
      }, null, 2));

      document.getElementById('submitBtn').disabled = true;
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (!result.success) {
          errorEl.textContent = result.message;
          document.getElementById('submitBtn').disabled = false;
          return;
        }

        await liff.sendMessages([
          { type: "text", text: `已記錄請假,並回報請假\n假別：${payload.leaveType}\n日期：${payload.date}\n時間：${start}~${end}（共 ${result.hours} 小時）` }
        ]);
        liff.closeWindow();
      } catch (err) {
        errorEl.textContent = "送出失敗,請稍後再試或聯繫人資";
        document.getElementById('submitBtn').disabled = false;
      }
    }

    document.getElementById('submitBtn').addEventListener('click', submitLeaveRequest);
  </script>
</body>
</html>
